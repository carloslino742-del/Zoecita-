<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Para mi Zoecita bonita 💖</title>
<style>
*{box-sizing:border-box}
body{
 margin:0; min-height:100vh; overflow:hidden; display:flex; align-items:center; justify-content:center;
 font-family:Georgia,serif; background:radial-gradient(circle at top,#ffdce8,#ff9fbd 45%,#b51f52);
 color:#fff;
}
.card{
 width:min(90%,620px); padding:42px 28px; text-align:center; border-radius:30px;
 background:rgba(100,0,35,.28); backdrop-filter:blur(8px);
 box-shadow:0 15px 50px rgba(80,0,25,.35); border:1px solid rgba(255,255,255,.35);
}
h1{font-size:clamp(32px,8vw,58px);margin:0 0 18px}
p{font-size:clamp(20px,5vw,30px);line-height:1.45;margin:10px 0}
button{
 margin-top:20px; padding:14px 24px; border:0; border-radius:999px; cursor:pointer;
 background:#fff; color:#a7194b; font-size:18px; font-weight:bold;
}
.heart{position:absolute;bottom:-50px;animation:subir linear infinite;opacity:.8}
@keyframes subir{to{transform:translateY(-115vh) rotate(20deg);opacity:0}}
.rose{font-size:48px;margin:8px}
.small{font-size:14px;opacity:.85;margin-top:22px}
</style>
</head>
<body>
<div class="card">
  <div class="rose">🌹💖🌹</div>
  <h1>Te amo, mi Zoecita bonita 💖</h1>
  <p>No quiero que estés enojada, mi amor 🥺❤️</p>
  <p>Quiero que sepas que eres muy especial para mí. 🌹</p>
  <button onclick="window.open('https://www.youtube.com/results?search_query=El+Primer+Tonto+Cardenales+de+Nuevo+Leon','_blank')">
    🎵 Escuchar “El Primer Tonto”
  </button>
  <div class="small">Hecho con mucho cariño 💕</div>
</div>
<script>
const emojis=["💖","💕","❤️","🌹","💗","🌸"];
for(let i=0;i<28;i++){
 const s=document.createElement("span");
 s.className="heart";
 s.textContent=emojis[Math.floor(Math.random()*emojis.length)];
 s.style.left=Math.random()*100+"vw";
 s.style.fontSize=(18+Math.random()*28)+"px";
 s.style.animationDuration=(5+Math.random()*8)+"s";
 s.style.animationDelay=(-Math.random()*10)+"s";
 document.body.appendChild(s);
}
</script>
</body>
</html>
